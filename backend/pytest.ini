[pytest]
# Pytest configuration for Bona RAG backend tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers for test categorization
markers =
    unit: Unit tests for individual services
    integration: Integration tests for service workflows
    performance: Performance and stress tests
    error_handling: Error handling and edge cases
    config: Configuration tests
    models: Data model validation tests

# Coverage options
[coverage:run]
branch = True
source = src
omit =
    */tests/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
